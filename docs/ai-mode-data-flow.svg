<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">STSICONIC BI — How Data Reaches the AI Model</title>
  <desc id="desc">Client-facing schematic showing authenticated requests and Google Sheets data being transformed into deterministic analytics before bounded facts or exact tool results are transferred to OpenRouter.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#315f7d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#587b69"/>
    </marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#18222d}
      .title{font-size:34px;font-weight:700;letter-spacing:-.3px}
      .subtitle{font-size:15px;fill:#55616d}
      .section{font-size:19px;font-weight:700;letter-spacing:.2px}
      .group{font-size:16px;font-weight:700}
      .label{font-size:14px;font-weight:650}
      .body{font-size:13px;fill:#35424e}
      .small{font-size:11.5px;fill:#4f5c68}
      .micro{font-size:10.5px;fill:#5c6873}
      .panel{fill:#fff;stroke:#cbd3da;stroke-width:1.5}
      .soft{fill:#f7f8fa;stroke:#d8dee4;stroke-width:1.2}
      .server{fill:#fbfcfd;stroke:#315f7d;stroke-width:2}
      .accent{fill:#eef3f6;stroke:#7f9aab;stroke-width:1.3}
      .sheet{fill:#f6faf8;stroke:#789686;stroke-width:1.5}
      .provider{fill:#fff;stroke:#587b69;stroke-width:1.7;stroke-dasharray:7 5}
      .lane-a{fill:#fbfdfb;stroke:#789686;stroke-width:1.4}
      .lane-b{fill:#fbfcfd;stroke:#7f9aab;stroke-width:1.4}
      .flow{fill:none;stroke:#315f7d;stroke-width:2;marker-end:url(#arrow-blue)}
      .flow-green{fill:none;stroke:#587b69;stroke-width:1.8;marker-end:url(#arrow-green)}
      .divider{stroke:#e0e4e8;stroke-width:1}
      .guarantee{fill:#f8f9fa;stroke:#d8dee4;stroke-width:1.2}
      .sent{fill:#f6faf8;stroke:#789686;stroke-width:1.2}
      .never{fill:#fffafa;stroke:#c69a9a;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#fff"/>
  <text x="40" y="48" class="title">STSICONIC BI — How Data Reaches the AI Model</text>
  <text x="40" y="75" class="subtitle">Deterministic server calculations first · bounded AI payloads second</text>
  <text x="1880" y="48" text-anchor="end" class="small">Client data-transfer overview · 16:9</text>

  <!-- Request and source inputs -->
  <rect x="40" y="105" width="290" height="700" rx="10" class="panel"/>
  <path d="M40 153V115Q40 105 50 105H320Q330 105 330 115V153Z" fill="#eef3f6"/>
  <text x="60" y="137" class="section">1 · Request + source</text>

  <rect x="60" y="180" width="250" height="124" rx="8" class="soft"/>
  <text x="80" y="211" class="group">Browser request</text>
  <text x="80" y="238" class="body">Authenticated user action</text>
  <text x="80" y="261" class="small">Active URL filters</text>
  <text x="80" y="282" class="small">Question, insight or report request</text>

  <rect x="60" y="390" width="250" height="140" rx="8" class="sheet"/>
  <text x="80" y="423" class="group">Google Sheets API v4</text>
  <text x="80" y="451" class="body">Read-only analytics source</text>
  <text x="80" y="475" class="small">Worksheet values</text>
  <text x="80" y="496" class="small">No model or database writes</text>

  <line x1="60" y1="575" x2="310" y2="575" class="divider"/>
  <text x="60" y="608" class="label">Persistent database data</text>
  <text x="60" y="633" class="small">Encrypted connection settings only</text>
  <text x="60" y="654" class="small">No worksheet rows in PostgreSQL</text>

  <!-- Deterministic server preparation -->
  <rect x="360" y="105" width="520" height="700" rx="10" class="server"/>
  <text x="382" y="137" class="section">2 · Deterministic server preparation</text>
  <text x="858" y="137" text-anchor="end" class="small">Server-side trust boundary</text>

  <rect x="395" y="170" width="450" height="90" rx="8" class="accent"/>
  <text x="620" y="201" text-anchor="middle" class="group">Authenticated AI API</text>
  <text x="620" y="226" text-anchor="middle" class="body">Clerk userId from locals.auth()</text>
  <text x="620" y="247" text-anchor="middle" class="small">Request schema + active filters</text>

  <rect x="395" y="300" width="450" height="96" rx="8" class="panel"/>
  <text x="620" y="332" text-anchor="middle" class="group">Sheet loading</text>
  <text x="620" y="357" text-anchor="middle" class="body">Connection record · cache or Google fetch</text>
  <text x="620" y="379" text-anchor="middle" class="small">API key decrypted only on the server</text>

  <rect x="395" y="438" width="450" height="100" rx="8" class="accent"/>
  <text x="620" y="470" text-anchor="middle" class="group">Parse + filter + aggregate</text>
  <text x="620" y="496" text-anchor="middle" class="body">15-header contract · TypeScript calculations</text>
  <text x="620" y="519" text-anchor="middle" class="small">Date window · dimensions · previous-period comparison</text>

  <rect x="395" y="584" width="450" height="112" rx="8" class="panel"/>
  <text x="620" y="619" text-anchor="middle" class="group">Deterministic analytics snapshot</text>
  <text x="620" y="646" text-anchor="middle" class="body">Period · KPIs · leaders · rankings</text>
  <text x="620" y="670" text-anchor="middle" class="body">Monthly and daily trends · evidence catalog</text>
  <text x="620" y="690" text-anchor="middle" class="micro">Raw row identifiers are excluded</text>

  <path d="M310 242H395" class="flow"/>
  <path d="M310 460H352V348H395" class="flow-green"/>
  <path d="M620 260V300" class="flow"/>
  <path d="M620 396V438" class="flow"/>
  <path d="M620 538V584" class="flow"/>

  <!-- Bounded AI transfer -->
  <text x="925" y="137" class="section">3 · Bounded AI transfer</text>

  <!-- Structured lane -->
  <rect x="920" y="160" width="960" height="286" rx="10" class="lane-a"/>
  <text x="945" y="194" class="group" fill="#355f4b">A · Structured insights + report</text>

  <rect x="945" y="220" width="205" height="120" rx="8" class="sheet"/>
  <text x="1048" y="251" text-anchor="middle" class="label">Evidence catalog</text>
  <text x="1048" y="277" text-anchor="middle" class="small">Allowed facts</text>
  <text x="1048" y="298" text-anchor="middle" class="small">Strict JSON schema</text>
  <text x="1048" y="321" text-anchor="middle" class="micro">Bounded server payload</text>

  <rect x="1200" y="205" width="220" height="150" rx="9" class="provider"/>
  <text x="1310" y="227" text-anchor="middle" class="micro" fill="#587b69">AI PROVIDER BOUNDARY</text>
  <text x="1310" y="264" text-anchor="middle" class="group">OpenRouter</text>
  <text x="1310" y="289" text-anchor="middle" class="body">DeepSeek V4 Flash</text>
  <text x="1310" y="316" text-anchor="middle" class="small">Returns structured JSON</text>

  <rect x="1470" y="220" width="205" height="120" rx="8" class="panel"/>
  <text x="1573" y="251" text-anchor="middle" class="label">Server validation</text>
  <text x="1573" y="277" text-anchor="middle" class="small">Evidence keys · schema</text>
  <text x="1573" y="298" text-anchor="middle" class="small">ROI semantics</text>
  <text x="1573" y="321" text-anchor="middle" class="micro">Reject invalid output</text>

  <rect x="1715" y="235" width="140" height="90" rx="8" class="sheet"/>
  <text x="1785" y="267" text-anchor="middle" class="label">Insights</text>
  <text x="1785" y="289" text-anchor="middle" class="label">+ report</text>
  <text x="1785" y="310" text-anchor="middle" class="micro">Displayed in UI</text>

  <path d="M845 620H890V280H945" class="flow-green"/>
  <path d="M1150 280H1200" class="flow-green"/>
  <path d="M1420 280H1470" class="flow-green"/>
  <path d="M1675 280H1715" class="flow-green"/>

  <!-- Free-form lane -->
  <rect x="920" y="470" width="960" height="335" rx="10" class="lane-b"/>
  <text x="945" y="505" class="group">B · Free-form questions</text>

  <rect x="955" y="548" width="250" height="150" rx="8" class="accent"/>
  <text x="1080" y="579" text-anchor="middle" class="label">Restricted server tools</text>
  <text x="1080" y="605" text-anchor="middle" class="small">Overview · Rank</text>
  <text x="1080" y="626" text-anchor="middle" class="small">Compare · Trend</text>
  <text x="1080" y="652" text-anchor="middle" class="micro">Read deterministic snapshot</text>
  <text x="1080" y="674" text-anchor="middle" class="micro">Zod-valid tool arguments</text>

  <rect x="1325" y="530" width="240" height="185" rx="9" class="provider"/>
  <text x="1445" y="553" text-anchor="middle" class="micro" fill="#587b69">AI PROVIDER BOUNDARY</text>
  <text x="1445" y="590" text-anchor="middle" class="group">OpenRouter</text>
  <text x="1445" y="615" text-anchor="middle" class="body">DeepSeek V4 Flash</text>
  <text x="1445" y="642" text-anchor="middle" class="small">Question + recent messages</text>
  <text x="1445" y="663" text-anchor="middle" class="small">Tool schemas</text>
  <text x="1445" y="690" text-anchor="middle" class="micro">Final answer remains free text</text>

  <rect x="1690" y="565" width="165" height="120" rx="8" class="panel"/>
  <text x="1773" y="598" text-anchor="middle" class="label">Answer</text>
  <text x="1773" y="622" text-anchor="middle" class="label">+ visible tool results</text>
  <text x="1773" y="650" text-anchor="middle" class="micro">Evidence panel in UI</text>
  <text x="1773" y="671" text-anchor="middle" class="micro">Prose not claim-validated</text>

  <path d="M845 640H890V623H955" class="flow"/>
  <path d="M1325 592H1240V592H1205" class="flow"/>
  <text x="1265" y="579" text-anchor="middle" class="micro">Required tool request</text>
  <path d="M1205 661H1240V661H1325" class="flow"/>
  <text x="1265" y="681" text-anchor="middle" class="micro">Exact tool results</text>
  <path d="M1565 623H1690" class="flow"/>

  <!-- Transfer guarantees -->
  <rect x="40" y="845" width="1840" height="190" rx="10" class="guarantee"/>
  <text x="60" y="880" class="section">Data transfer guarantees</text>
  <line x1="60" y1="897" x2="1860" y2="897" class="divider"/>

  <rect x="60" y="920" width="850" height="88" rx="8" class="sent"/>
  <circle cx="92" cy="952" r="14" fill="#587b69"/>
  <path d="M85 952L90 957 100 946" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="120" y="948" class="group" fill="#355f4b">SENT TO AI</text>
  <text x="120" y="975" class="body">Selected period · calculated metrics · rankings · evidence or exact tool results</text>
  <text x="120" y="996" class="micro">Free-form path also sends the question, recent message text and tool schemas</text>

  <rect x="950" y="920" width="910" height="88" rx="8" class="never"/>
  <circle cx="982" cy="952" r="14" fill="#a85656"/>
  <path d="M975 945L989 959M989 945L975 959" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1010" y="948" class="group" fill="#8e3d3d">NEVER SENT</text>
  <text x="1010" y="975" class="body">API keys · Clerk user objects · raw row IDs · raw worksheet rows · direct Sheet access</text>
  <text x="1010" y="996" class="micro">AI providers receive bounded server-generated payloads only</text>

  <text x="1860" y="1025" text-anchor="end" class="micro">Solid blue: server data flow · Green: bounded AI payload · Dashed box: external AI provider</text>
</svg>
